<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>  </title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #000000;
      overflow: hidden;
    }
    h1 {
      text-align: center;
      margin: 10px 0;
    }
    svg {
      display: block;
      width: 100%;
      height: calc(100% - 50px);
    }
    .linkLine { stroke: #999; stroke-opacity: 0; stroke-width: 2px; }
    .nodeText {
      font-size: 16px;
      cursor: pointer;
      text-decoration: underline;
      fill: #00f;
      text-transform: lowercase;
      text-anchor: middle;
    }
  </style>
</head>
<body>

<svg></svg>

<script>
let width = window.innerWidth;
let height = window.innerHeight;

// --------------------
// Nodos y enlaces
// --------------------
const nodes = [
  {id: "youtube", url: "https://www.youtube.com"},
  {id: "substack", url: "https://substack.com/home"},
  {id: "sublime", url: "https://sublime.app/amiama"},
  {id: "Are.na", url: "https://www.are.na/laura-amiama/channels"},
  {id: "journal", url: "journal.html"},
  {id: "gif1", img: "https://raw.githubusercontent.com/amiamaa/amiamaa.github.io/main/original_978baf0a90bc0e475507f2a52b525ed2.gif"}
];

const links = [
  {source: "youtube", target: "substack"},
  {source: "gif1", target: "substack"},
  {source: "gif1", target: "sublime"},
  {source: "gif1", target: "journal"},
  {source: "Are.na", target: "sublime"}
];

// Fijar GIF en el centro
nodes.forEach(d => {
  if(d.img){
    d.fx = width / 2;
    d.fy = height / 2;
  }
});

const svg = d3.select("svg")
  .attr("width", width)
  .attr("height", height);

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(200))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2));

const link = svg.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "linkLine");

// Crear nodos generales
const node = svg.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .call(d3.drag()
    .on("start", event => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      event.subject.fx = event.subject.x;
      event.subject.fy = event.subject.y;
    })
    .on("drag", event => {
      if(!event.subject.img){ // solo nodos de texto se pueden mover
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
    })
    .on("end", event => {
      if (!event.active) simulation.alphaTarget(0);
      if(!event.subject.img){
        event.subject.fx = null;
        event.subject.fy = null;
      }
    })
  );

// --------------------
// Animación de entrada del GIF y aparición de nodos
// --------------------
let introActive = true;
const gifNode = node.filter(d => d.img);
const gifSizeNormal = 240;
const gifSizeIntro = gifSizeNormal * 2; // GIF crece más

// Empezar con GIF pequeño
const gifImage = gifNode.append("image")
  .attr("href", d => d.img)
  .attr("width", gifSizeNormal)
  .attr("height", gifSizeNormal)
  .attr("x", -gifSizeNormal/2)
  .attr("y", -gifSizeNormal/2)
  .attr("transform", "scale(0)");

// Posición inicial de los nodos de texto: en el centro
node.filter(d => !d.img)
  .attr("transform", `translate(${width/2}, ${height/2})`)
  .style("opacity", 0);

// Ocultar enlaces al inicio
link.style("opacity", 0);

// Animación de crecimiento del GIF
gifImage.transition()
  .duration(2000)
  .ease(d3.easeCubicOut)
  .attr("transform", `scale(${gifSizeIntro / gifSizeNormal})`);

// Mostrar nodos y enlaces al hacer clic
d3.select("body").on("click", () => {
  if (!introActive) return;
  introActive = false;

  // Encoger GIF a tamaño normal
  gifImage.transition()
    .duration(1200)
    .ease(d3.easeCubicInOut)
    .attr("transform", "scale(1)");

  // Aparecen nodos de texto desde el centro hacia su posición
  node.filter(d => !d.img)
    .transition()
    .delay(600)
    .duration(1200)
    .style("opacity", 1)
    .attrTween("transform", function(d) {
        const iX = d3.interpolate(width/2, d.x);
        const iY = d3.interpolate(height/2, d.y);
        return function(t) {
            return `translate(${iX(t)},${iY(t)})`;
        };
    });

  // Aparecen enlaces
  link.transition()
    .delay(800)
    .duration(1000)
    .style("opacity", 0.3);
});

// Dibujar texto si el nodo NO tiene imagen
node.filter(d => !d.img)
  .append("text")
  .attr("class", "nodeText")
  .attr("dy", 5)
  .text(d => d.id)
  .on("click", (event, d) => window.open(d.url, "_blank"));

// Actualizar posición de nodos en cada tick
simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

// Ajustar SVG al cambiar tamaño de ventana
window.addEventListener("resize", () => {
  width = window.innerWidth;
  height = window.innerHeight - 50;
  svg.attr("width", width).attr("height", height);
  simulation.force("center", d3.forceCenter(width / 2, height / 2));
  simulation.alpha(0.5).restart();
  // Mantener GIF centrado
  nodes.forEach(d => {
    if(d.img){
      d.fx = width / 2;
      d.fy = height / 2;
    }
  });
});
</script>
</body>
</html>
