<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>journal</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .entry {
      margin-bottom: 80px;
    }

    .date {
      font-size: 16px;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .text {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .images img {
      width: 100%;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Entrada 1 -->
    <div class="entry">
      <div class="date">03 - 01 - 2026:</div>
      <div class="text">
        Ejemplo 1
      </div>
      <div class="images">
        <img src="img/diario1.jpg">
        <img src="img/diario2.jpg">
      </div>
    </div>

    <!-- Entrada 2 -->
    <div class="entry">
      <div class="date">x - x - x:</div>
      <div class="text">
        Ejemplo
      </div>
      <div class="images">
        <img src="img/diario3.jpg">
      </div>
    </div>

  </div>
</body>
</html>
